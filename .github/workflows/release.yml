name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:live

  release-please:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5

  publish:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:live
      - run: npm pack --dry-run
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > "gaia-mcp-${{ needs.release-please.outputs.tag-name }}-sbom.cdx.json"
      - name: Publish package
        run: npm publish --access public
        env:
          # Used only to bootstrap the first package version. npm prefers OIDC
          # after the trusted publisher exists; remove this secret afterward.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      - name: Attach SBOM to GitHub Release
        run: gh release upload "${{ needs.release-please.outputs.tag-name }}" "gaia-mcp-${{ needs.release-please.outputs.tag-name }}-sbom.cdx.json"
        env:
          GH_TOKEN: ${{ github.token }}
